[package]
name = "sap-adt-mcp-server-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
default-run = "sap-adt-mcp-server-relay"

[workspace]
resolver = "3"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
hex = "0.4"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "json"] }
ring = "0.17"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tempfile = "3"
time = "0.3"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.18"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_IO"] }

[dev-dependencies]
futures-util = { version = "0.3", features = ["sink"] }
portable-pty = "0.9"
tokio = { version = "1", features = ["process"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
vt100 = "0.15"

[workspace.lints.clippy]
pedantic = "deny"
nursery = "deny"

[lints]
workspace = true
