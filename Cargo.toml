[package]
name = "sap-adt-mcp-server-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
default-run = "sap-adt-mcp-server-relay"

[workspace]
resolver = "3"

# Async runtime: smol only. No crate in this tree may pull in Tokio: hyper 1.x
# (and so axum, reqwest) depends on tokio unconditionally, so HTTP is Trillium.
# WebSockets use async-tungstenite on Trillium's upgraded transport.
[dependencies]
anyhow = "1"
async-tungstenite = { version = "0.35", default-features = false, features = ["handshake", "futures-03-sink"] }
base64 = "0.23.1"
clap = { version = "4.6.9", features = ["derive"] }
crossterm = "0.29.0"
ctrlc = "3"
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = "0.4"
trillium-client = { version = "0.9.21", default-features = false }
trillium-http = "1.8.2"
trillium-rustls = { version = "0.11.5", default-features = false, features = ["ring", "client"] }
trillium-server-common = "0.7.15"
trillium-smol = "0.7"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
subtle = "2"
tempfile = "3"
time = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.18"
zeroize = "1.9.2"

[dev-dependencies]
portable-pty = "0.9"
vt100 = "0.18.1"

[workspace.lints.clippy]
pedantic = "deny"
nursery = "deny"

[lints]
workspace = true
