name: Eclipse Update Site

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: eclipse-update-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: java-plugin/sap-adt-mcp-server

    steps:
      - name: Check Out Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Set Up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Maven 3.10.0
        env:
          MAVEN_VERSION: '3.10.0'
          # SHA-512 published by Apache for the binary tarball.
          MAVEN_SHA512: 908b1501bfb420bf7c8affb855534a9c407fd6099367bfb9f2f2dcb8e9799102bffb84518cde74c679bd76870247c6528683abdd620581bffa90f95d92d175aa
        run: |
          archive="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$MAVEN_VERSION/$archive"
          printf '%s  %s\n' "$MAVEN_SHA512" "$archive" | sha512sum --check
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin" >> "$GITHUB_PATH"

      - name: Build Eclipse Update Site
        run: |
          mvn --batch-mode --version | tee "$RUNNER_TEMP/maven-version.txt"
          grep -Fq 'Apache Maven 3.10.0 (' "$RUNNER_TEMP/maven-version.txt"
          qualifier=$(date -u +%Y%m%d%H%M%S)
          mvn --batch-mode --no-transfer-progress "-DforceContextQualifier=$qualifier" clean verify

      - name: Run Java Harnesses
        working-directory: ${{ github.workspace }}
        run: bash java-plugin/sap-adt-mcp-server/tests/run-harnesses.sh

      - name: Stage Pages Site
        run: |
          site=com.sap.adt.mcp.server.site/target/repository
          for file in "$site"/{p2.index,content.jar,artifacts.jar} \
                      "$site"/features/com.sap.adt.mcp.server.feature_*.jar \
                      "$site"/plugins/com.sap.adt.mcp.server.plugin_*.jar; do
            if [[ ! -s "$file" ]]; then
              echo "Missing or empty update site file: $file" >&2
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/pages/eclipse"
          cp -R "$site/." "$RUNNER_TEMP/pages/eclipse/"
          cat > "$RUNNER_TEMP/pages/index.html" <<'HTML'
          <!doctype html>
          <html lang="en"><meta charset="utf-8"><title>SAP ADT MCP Relay</title>
          <h1>SAP ADT MCP Relay</h1>
          <p>In Eclipse, open Help → Install New Software → Add and enter this site's root URL followed by <code>eclipse/</code>.</p>
          <p><a href="eclipse/p2.index">View the Eclipse repository index</a></p>
          </html>
          HTML

      - name: Upload Pages Artifact
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    name: Publish Update Site
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Show Eclipse Update Site URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf 'Eclipse update site: %s/eclipse/\n' "${PAGE_URL%/}" >> "$GITHUB_STEP_SUMMARY"
